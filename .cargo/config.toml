# Android 15+ (API 35+) и Android 16 на устройствах с 16-КБ страницами
# требуют, чтобы LOAD-сегменты нативных библиотек были выровнены на 16 КБ.
# Без этого dlopen отклоняет libheliwatch_lib.so, и процесс падает с SIGABRT
# сразу после старта (зелёный фон окна → вылет). Флаг действует на оба
# 64-битных Android-таргета; 32-битные остаются с 4-КБ выравниванием.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
