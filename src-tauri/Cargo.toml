[package]
name = "heliwatch"
version = "0.7.0"
description = "HeliWatch — совместный просмотр видео с голосом и чатом (Android, Tauri v2)"
authors = ["HeliWatch"]
license = "MIT"
repository = "https://github.com/vezdehod2115/HeliWatch"
edition = "2021"
rust-version = "1.90"

[lib]
name = "heliwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-heliwatch = { path = "plugins/heliwatch" }
