[package]
name = "tauri-plugin-heliwatch"
version = "0.8.0"
description = "HeliWatch: нативный Android-контейнер с двумя WebView"
authors = ["HeliWatch"]
license = "MIT"
repository = "https://github.com/vezdehod2115/HeliWatch"
edition = "2021"
rust-version = "1.90"
links = "tauri-plugin-heliwatch"

[lib]
name = "tauri_plugin_heliwatch"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.12.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
